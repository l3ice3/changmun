<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- 창문 로고 v2 "새벽빛 창" — CSS 변수를 못 쓰는 컨텍스트라 색을 고정 인라인. WindowMark.tsx와 동일 지오메트리. -->
  <defs>
    <!-- line은 바운딩박스 0폭이라 기본 그라데이션 미렌더 → userSpaceOnUse 좌표 고정 -->
    <linearGradient id="frame" gradientUnits="userSpaceOnUse" x1="21" y1="11" x2="79" y2="89">
      <stop offset="0" stop-color="#8A96F9" />
      <stop offset="1" stop-color="#4C5AE2" />
    </linearGradient>
    <linearGradient id="sky" gradientUnits="userSpaceOnUse" x1="50" y1="14.6" x2="50" y2="85.4">
      <stop offset="0" stop-color="#5466EB" />
      <stop offset="0.42" stop-color="#8B8AF0" />
      <stop offset="0.62" stop-color="#CD9CD6" />
      <stop offset="0.78" stop-color="#F7AB7A" />
      <stop offset="1" stop-color="#FFCB8A" />
    </linearGradient>
    <linearGradient id="shade" gradientUnits="userSpaceOnUse" x1="50" y1="14.6" x2="50" y2="85.4">
      <stop offset="0" stop-color="#181C46" stop-opacity="0.28" />
      <stop offset="0.2" stop-color="#181C46" stop-opacity="0" />
    </linearGradient>
  </defs>
  <rect x="24.6" y="14.6" width="50.8" height="70.8" rx="9" fill="url(#sky)" />
  <rect x="24.6" y="14.6" width="50.8" height="70.8" rx="9" fill="url(#shade)" />
  <line x1="50" y1="17" x2="50" y2="83" stroke="url(#frame)" stroke-width="6" stroke-linecap="round" />
  <line x1="27" y1="50" x2="73" y2="50" stroke="url(#frame)" stroke-width="6" stroke-linecap="round" />
  <rect x="24.6" y="14.6" width="50.8" height="70.8" rx="9.5" fill="none" stroke="url(#frame)" stroke-width="7.2" />
</svg>
