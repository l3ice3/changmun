<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- 창문 로고 v3 "빛나는 창틀" — WindowMark.tsx와 동일 기하(파비콘용 정적 사본, 색 고정 인라인) -->
  <defs>
    <!-- line은 바운딩박스 0폭이라 기본 그라데이션 미렌더 → userSpaceOnUse 좌표 고정 -->
    <linearGradient id="sheen" gradientUnits="userSpaceOnUse" x1="21" y1="11" x2="79" y2="89">
      <stop offset="0" stop-color="#b3bcff"/>
      <stop offset="0.28" stop-color="#6b78f0"/>
      <stop offset="0.5" stop-color="#4650d8"/>
      <stop offset="0.68" stop-color="#8d98fa"/>
      <stop offset="1" stop-color="#3a46c4"/>
    </linearGradient>
  </defs>
  <line x1="57.5" y1="17" x2="57.5" y2="83" stroke="url(#sheen)" stroke-width="6" stroke-linecap="round"/>
  <line x1="27" y1="43.5" x2="73" y2="43.5" stroke="url(#sheen)" stroke-width="6" stroke-linecap="round"/>
  <rect x="24.6" y="14.6" width="50.8" height="70.8" rx="9.5" fill="none" stroke="url(#sheen)" stroke-width="7.2"/>
  <rect x="28.6" y="18.6" width="42.8" height="62.8" rx="6.5" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1.4"/>
</svg>
