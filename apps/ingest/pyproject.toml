[tool.poetry]
name = "changmun-ingest"
version = "0.1.0"
description = "changmun 수집·정규화·dedup·페르소나 부여 배치 (일 1회 실행)"
authors = ["changmun team"]
packages = [{ include = "ingest", from = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
# 수집/DB 의존성(httpx·psycopg 등)은 FR-001 구현 시 확정해 추가한다 — 미리 넣지 않음

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
