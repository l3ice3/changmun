[tool.poetry]
name = "changmun-ingest"
version = "0.1.0"
description = "changmun 수집·정규화·dedup·페르소나 부여 배치 (일 1회 실행)"
authors = ["changmun team"]
packages = [{ include = "ingest", from = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
requests = "^2.32"
psycopg = { version = "^3.2", extras = ["binary"] }
python-dotenv = "^1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
