[tool.poetry]
name = "changmun-ingest"
version = "0.1.0"
description = "changmun 수집·정규화·dedup·페르소나 부여 배치 (일 1회 실행)"
authors = ["changmun team"]
packages = [{ include = "ingest", from = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
requests = "^2.32"
psycopg = { version = "^3.2", extras = ["binary"] }
python-dotenv = "^1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
ruff = "^0.6"
mypy = "^1.11"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

# 창문 ingest 린트 = 계산적 센서.
# .claude/rules/ingest.md 의 산문 규칙 중 "기계로 셀 수 있는 것"만 여기에 인코딩한다.
[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
# 기존 코드가 무타입이라 느슨하게 시작한다. 조이는 건 위반 로그가 쌓인 뒤.
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
