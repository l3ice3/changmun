name: deploy-api

# api 자동 배포 파이프라인 (CI/CD) — 빌드는 여기서, 배포는 EC2가 pull.
#
# 흐름:
#   push→main (apps/api 또는 db/migrations 변경)
#     → 이 워크플로가 Docker 이미지를 빌드해 GHCR에 push
#     → EC2 cron이 새 이미지를 pull 해서 교체(별도, 이 워크플로 밖)
#
# 왜 이 구조:
#   - 빌드를 프로덕션 EC2(2GB)에서 하지 않는다(자원 압박·느림 방지). 실무 표준.
#   - EC2는 Graviton(ARM)이라 이미지도 arm64여야 한다 → ubuntu-24.04-arm 네이티브 러너
#     (public 레포는 arm 러너 무료 → QEMU 에뮬레이션 없이 빠르게 빌드).
#   - 태그를 latest + <sha> 둘로 → 롤백은 .env의 API_IMAGE_TAG=<옛 sha>로 핀.
#
# 전제(1회 셋업): 첫 push 후 GHCR 패키지(changmun-api)를 public으로 전환
#   → EC2가 인증 없이 pull(시크릿 불필요). GitHub → Packages → changmun-api → Package settings.

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'db/migrations/**'          # Flyway 마이그레이션도 이미지에 포함됨(Dockerfile COPY)
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:                 # 수동 트리거(재배포·강제 빌드용)

concurrency:
  group: deploy-api
  cancel-in-progress: false          # 배포 도중 취소 금지(중간 상태 방지)

env:
  IMAGE: ghcr.io/l3ice3/changmun-api

jobs:
  build-push:
    runs-on: ubuntu-24.04-arm        # 네이티브 arm64(EC2 t4g/Graviton과 동일 아키텍처)
    permissions:
      contents: read
      packages: write                # GHCR push 권한(GITHUB_TOKEN에 부여)
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # 내장 토큰 — 별도 시크릿 불필요

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .                 # 레포 루트(db/migrations 포함 위함 — Dockerfile 전제)
          file: apps/api/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
