name: Codex Review (Soft Suggestions)

# B/C그룹. 의미·설계 판단을 코멘트로만 남긴다. 차단하지 않는다.
# 근거: docs/rules/rules-review-bot.md B,C섹션
# 사전 준비: Settings > Secrets > Actions 에 OPENAI_API_KEY 등록

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  codex-review:
    runs-on: ubuntu-latest
    # 리뷰봇 장애가 PR을 빨간불로 만들지 않게 — 제안 전용, 차단 금지
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Codex CLI
        run: npm install -g @openai/codex

      - name: Save PR diff
        run: git diff ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} > pr.diff

      - name: Run Codex review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          codex exec --sandbox read-only --output-last-message review.md "
          이 저장소의 pr.diff 파일(PR 변경분)을 docs/rules/ 의 코딩 규칙에 따라 리뷰하라.

          [중요] 너는 '제안만' 한다. 절대 머지를 막지 마라.
          정적 분석(Checkstyle/PMD/ArchUnit)이 이미 잡는 항목
          (라인 수, depth, 인자 수, else/switch/삼항, 필드 수, 계층 의존)은
          중복 지적하지 마라.

          네가 볼 것은 기계가 못 잡는 의미·설계 판단이다 (docs/rules/rules-review-bot.md B,C섹션):
          - SRP: 변경 이유가 다른 코드가 한 클래스에 섞였는가
          - Tell, Don't Ask: 데이터를 꺼내 외부에서 판단하는가
          - 다형성 전환 시점: 같은 타입 분기가 2곳 이상 반복되는가
          - 추상화 레벨: 공통 기능을 상위에서 구현해야 하는가
          - 불변 가능성: 변경 여지 없는 상태가 가변으로 남았는가
          - null 대신 객체로 표현할 '없음' 상태가 있는가
          - 트랜잭션 경계: 정합성을 타이트/느슨 중 무엇으로 봐야 하는가
          - 테스트가 행위 완결성을 검증하는가, 단순 위임 Controller를 불필요하게 테스트하는가

          각 지적은 파일/라인을 명시하고, 근거가 되는 규칙 문서 섹션을 인용하라.
          근거가 약하면 지적하지 말고 넘어가라. 확신 있는 것만 말하라.
          출력은 GitHub PR 코멘트용 마크다운으로 작성하고,
          마지막에 '이건 제안이며 머지를 막지 않는다'를 명시하라.
          "

      - name: Post review comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s review.md ]; then
            gh pr comment ${{ github.event.pull_request.number }} --body-file review.md
          else
            echo "리뷰 결과 없음 — 코멘트 생략"
          fi
