name: codex-review-notify

# Codex가 PR 리뷰를 끝내면 Discord로 알린다.
#  - formal review(이슈·제안 있을 때) + "Codex Review" 코멘트(이슈 없을 때) 둘 다 포착.
#  - 사람이 "리뷰 끝났으니 확인/머지" 시점을 알게 하는 용도. 자동 수정·머지는 안 한다.
on:
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created]

permissions: {}   # GITHUB_TOKEN 권한 불필요(이벤트 데이터 + Discord 시크릿만 사용)

jobs:
  notify:
    # 두 경로만 통과:
    #  1) 봇이 제출한 formal review
    #  2) Codex가 PR에 단 "Codex Review" 코멘트 — "connect" 안내 등 다른 봇 코멘트는 본문 필터로 제외
    if: >-
      (github.event_name == 'pull_request_review' && github.event.review.user.type == 'Bot') ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
      github.event.comment.user.login == 'chatgpt-codex-connector' &&
      contains(github.event.comment.body, 'Codex Review'))
    runs-on: ubuntu-latest
    steps:
      - name: Discord 알림
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_CICD }}
          # 값은 env로 받아 스크립트 인젝션을 막고, JSON은 jq로 안전 조립(제목 특수문자 대응).
          # review/comment 중 존재하는 쪽을 || 로 선택.
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          PR_TITLE: ${{ github.event.pull_request.title || github.event.issue.title }}
          PR_URL: ${{ github.event.review.html_url || github.event.comment.html_url }}
          REVIEWER: ${{ github.event.review.user.login || github.event.comment.user.login }}
          STATE: ${{ github.event.review.state }}   # issue_comment면 빈값
        run: |
          if [ -n "$STATE" ]; then
            case "$STATE" in
              approved)          STATUS="✅ 승인";      COLOR=3066993 ;;
              changes_requested) STATUS="🔧 변경 요청"; COLOR=15158332 ;;
              *)                 STATUS="💬 리뷰 코멘트"; COLOR=3447003 ;;
            esac
          else
            STATUS="✅ 리뷰 완료(이슈 없음)"; COLOR=3066993
          fi
          jq -n \
            --arg title "🤖 Codex 리뷰 완료 · $STATUS" \
            --arg pr "#${PR_NUMBER} ${PR_TITLE}" \
            --arg reviewer "$REVIEWER" \
            --arg url "$PR_URL" \
            --argjson color "$COLOR" \
            '{
              username: "리뷰지기",
              embeds: [{
                title: $title,
                color: $color,
                url: $url,
                fields: [
                  { name: "PR", value: $pr, inline: false },
                  { name: "리뷰어", value: $reviewer, inline: true }
                ]
              }]
            }' \
          | curl -s -H "Content-Type: application/json" -X POST "$WEBHOOK" -d @-
